<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crew Roll</title>
  <meta name="description" content="Roll random anime characters and build the strongest crew: One Piece, Naruto, Dragon Ball, Hunter × Hunter, Bleach and Jujutsu Kaisen." />
  <meta name="theme-color" content="#0b0b0d" />
  <link rel="icon" type="image/png" href="../assets/logos/onepiecedle.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/style.css" />
  <link rel="stylesheet" href="../shared/online.css" />
  <link rel="stylesheet" href="crew.css" />
</head>
<body class="crew-page" data-game="crew">
  <div class="bg" aria-hidden="true"></div>

  <header class="topbar">
    <nav class="categories" id="categories" aria-label="Games"></nav>
    <div class="topbar-actions">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="fr">FR</button>
      </div>
    </div>
  </header>
  <div class="presence" id="presence"></div>

  <main class="page">
    <section class="card crew-bar">
      <div class="crew-brand">
        <span class="crew-brand-icon" id="crewBrandIcon" aria-hidden="true"></span>
        <div>
          <h1 id="crewTitle"></h1>
          <p class="muted" id="crewSub"></p>
        </div>
      </div>
      <div class="crew-settings">
        <div class="crew-setting" id="crewPickWrap">
          <span class="crew-setting-label" id="crewPickLabel"></span>
          <div class="anime-picker" id="animePicker"></div>
        </div>
        <div class="crew-setting">
          <span class="crew-setting-label" id="crewModeLabel"></span>
          <div class="mode-tabs crew-mode" role="tablist">
            <button type="button" role="tab" data-mode="solo"></button>
            <button type="button" role="tab" data-mode="online"></button>
            <button type="button" role="tab" data-mode="index"></button>
          </div>
        </div>
        <div class="crew-setting" id="crewArcWrap">
          <span class="crew-setting-label" id="crewArcLabel"></span>
          <a class="arc-chip" id="crewArcLink" href="#"><span id="crewArc"></span></a>
        </div>
      </div>
    </section>

    <section class="crew-layout" id="soloView">
      <div class="card crew-status">
        <div class="score-ring" aria-hidden="true">
          <svg viewBox="0 0 44 44"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b4a" /><stop offset="0.55" stop-color="#ff8a3d" /><stop offset="1" stop-color="#ffd34d" /></linearGradient></defs><circle class="score-ring-track" cx="22" cy="22" r="19" /><circle class="score-ring-fill" id="crewRing" cx="22" cy="22" r="19" pathLength="100" /></svg>
        </div>
        <div class="crew-score">
          <span class="crew-score-label" id="crewScoreLabel"></span>
          <span><b id="crewScore">–</b><span class="muted"> / 10</span></span>
        </div>
        <span class="crew-live-rank" id="crewLiveRank" hidden></span>
        <div class="crew-fill">
          <span class="crew-fill-text" id="crewFilled"></span>
          <div class="crew-pips" id="crewPips"></div>
        </div>
      </div>
      <div class="crew-board" id="crewBoard"></div>
      <div class="card roll-panel" id="rollPanel" aria-live="polite"></div>
    </section>

    <section class="ix-view" id="indexView" hidden></section>

    <section class="duel-view" id="duelView" hidden>
      <div class="card lobby" id="lobby"></div>
      <div class="duel" id="duel" hidden aria-live="polite"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="../shared/games.js"></script>
  <script src="../shared/admin.js"></script>
  <script src="../shared/decor.js"></script>
  <script src="../shared/ambient.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/fx.js"></script>
  <script src="../shared/profile.js"></script>
  <script src="../shared/link.js"></script>
  <script src="../shared/presence.js"></script>
  <script src="../shared/changelog.js"></script>
  <script src="../shared/rooms.js"></script>
  <script src="roster.js"></script>
  <script src="forms.js"></script>
  <script src="cutouts.js"></script>
  <script src="cinema.js"></script>
  <script src="crew.js"></script>
</body>
</html>
