<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bleachdle</title>
  <meta name="description" content="Daily anime character guessing games: Bleach, Hunter × Hunter, Dragon Ball and Naruto, spoiler-free for where you are in the anime." />
  <meta name="theme-color" content="#0b0b0d" />
  <link rel="icon" type="image/png" href="assets/logos/bleachdle.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared/style.css" />
</head>
<body data-game="home">
  <div class="bg" aria-hidden="true"><div class="bg-grid" id="bgGrid"></div></div>

  <header class="topbar">
    <nav class="categories" id="categories" data-i18n-aria="categories"></nav>
    <div class="topbar-actions">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="fr">FR</button>
      </div>
    </div>
  </header>
  <div class="presence" id="presence"></div>

  <main class="page">
    <section class="home-intro">
      <h1 data-i18n="homeTitle"></h1>
      <p data-i18n="homeSub"></p>
    </section>
    <section class="game-grid" id="gameGrid"></section>
    <footer class="footer"><p data-i18n="homeFooter"></p></footer>
  </main>

  <script src="shared/games.js"></script>
  <script src="shared/i18n.js"></script>
  <script src="shared/presence.js"></script>
  <script>
    (() => {
      const GAMES = window.DLE_GAMES;
      const $ = (s) => document.querySelector(s);
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const logo = (g) => `<img src="${g.logo}" alt="" onerror="this.onerror=null;this.src='assets/logos/placeholder.svg'" />`;
      let lang = window.DLE_LANG.get();

      $("#categories").innerHTML = GAMES.map((g) =>
        `<a class="cat" href="${g.path}"><span class="cat-logo">${logo(g)}</span><span class="cat-name">${esc(g.brand)}</span></a>`).join("");

      $("#bgGrid").innerHTML = GAMES.flatMap((g) => g.featured.map((id) => `${g.path}assets/characters/${id}.webp`))
        .flatMap((src, i, all) => [src, all[(i * 7 + 3) % all.length]])
        .concat(GAMES.flatMap((g) => g.featured.map((id) => `${g.path}assets/characters/${id}.webp`)))
        .map((src) => `<span style="background-image:url('${src}')"></span>`).join("").repeat(3);

      function render() {
        const t = window.DLE_UI[lang];
        document.documentElement.lang = lang;
        document.querySelectorAll("[data-i18n]").forEach((n) => (n.textContent = t[n.dataset.i18n]));
        document.querySelectorAll("[data-i18n-aria]").forEach((n) => n.setAttribute("aria-label", t[n.dataset.i18nAria]));
        document.querySelectorAll("[data-lang]").forEach((b) => b.classList.toggle("is-active", b.dataset.lang === lang));
        $("#gameGrid").innerHTML = GAMES.map((g) => `
          <a class="game-card" href="${g.path}" data-game="${g.id}">
            <div class="game-strip">${g.featured.map((id) => `<span style="background-image:url('${g.path}assets/characters/${id}.webp')"></span>`).join("")}</div>
            <div class="game-body">
              <span class="game-logo">${logo(g)}</span>
              <div class="game-text">
                <h2>${esc(g.brand)}</h2>
                <p>${esc(g.anime)} · ${g.count} ${t.chars} · ${g.arcs} arcs</p>
              </div>
              <span class="game-play">${t.play} <span aria-hidden="true">→</span></span>
            </div>
          </a>`).join("");
      }

      document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => {
        lang = b.dataset.lang;
        window.DLE_LANG.set(lang);
        render();
        window.dispatchEvent(new Event("dle:lang"));
      }));
      render();
    })();
  </script>
</body>
</html>
