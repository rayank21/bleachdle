# Portraits and logos: kept by the browser for a day, then shown from cache while a fresh copy loads.
# Pages, scripts and styles keep Netlify's default (always checked), so updates show at once.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"
[[headers]]
  for = "/:game/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=2592000"
